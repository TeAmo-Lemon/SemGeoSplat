name: semgeo
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.10
  - pip
  - cuda-version=12.4
  - cuda-nvcc=12.4.131
  - cuda-cudart-dev=12.4.127
  - cuda-cccl=12.4.127
  - ninja
  - numpy>=2,<2.2
  - scipy
  - scikit-learn
  - threadpoolctl
  - opencv
  - pillow
  - plyfile
  - tqdm
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - gsplat==1.4.0
      - faiss-gpu-cu12==1.14.1.post1
      - modelscope==1.38.1
      - transformers==5.14.1
      - viser==1.0.0
      - nerfview==0.1.3
      - av==17.0.0
      - splines
      - rich
      - tensorboard
